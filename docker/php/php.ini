; Profile photos are capped at 2M by ProfileType; the rest is multipart overhead.
; Keep in step with client_max_body_size in docker/nginx/default.conf.
upload_max_filesize = 8M
post_max_size = 8M

; Dompdf renders the whole CV in memory.
memory_limit = 256M
max_execution_time = 60

date.timezone = Europe/Warsaw

; The source lives on a Windows bind mount, where every stat() crosses a
; filesystem bridge. Symfony's dev-mode freshness checks and the autoloader make
; thousands of them per request, so caching resolved paths is the single biggest
; win available here.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

opcache.enable = 1
opcache.max_accelerated_files = 20000
; The source is a bind mount: edits on the host must take effect on the next
; request, so timestamps are revalidated every time. Turn this off for prod.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
